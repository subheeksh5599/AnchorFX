name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contract-tests:
    name: Contract Tests (Soroban)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup update stable && rustup target add wasm32-unknown-unknown
      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./contracts/anchorfx-escrow -> target, ./contracts/anchorfx-oracle -> target"
      - name: Run escrow contract tests
        working-directory: contracts/anchorfx-escrow
        run: cargo test
      - name: Run oracle contract tests
        working-directory: contracts/anchorfx-oracle
        run: cargo test
      - name: Verify WASM build (escrow)
        working-directory: contracts/anchorfx-escrow
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Verify WASM build (oracle)
        working-directory: contracts/anchorfx-oracle
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Check Rust formatting (escrow)
        working-directory: contracts/anchorfx-escrow
        run: cargo fmt --check
      - name: Check Rust formatting (oracle)
        working-directory: contracts/anchorfx-oracle
        run: cargo fmt --check
      - name: Clippy lint (escrow)
        working-directory: contracts/anchorfx-escrow
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy lint (oracle)
        working-directory: contracts/anchorfx-oracle
        run: cargo clippy --all-targets -- -D warnings

  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm test
      - name: TypeCheck (tsc)
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Format Check
        working-directory: frontend
        run: npx prettier --check "*.{ts,tsx,mjs,json}" "app/**/*.{ts,tsx}" "components/**/*.{ts,tsx}" "lib/**/*.{ts,tsx}" "__tests__/**/*.{ts,tsx}"
      - name: Lint
        working-directory: frontend
        run: npx eslint . --quiet